<head>
    <title>詳細</title>
    <script>
        const protocol = window.location.protocol;
        let css_path;
        let js_path;
        if (protocol === "file:") {
            css_path = "detail.css";
            js_path = "detail.js";
        }
        else {
            const host = window.location.host;
            css_path = `${protocol}//${host}/detail.html/css`
            js_path = `${protocol}//${host}/detail.html/js`
        }
        const css = document.createElement("link");
        css.rel = "stylesheet";
        css.type = "text/css";
        css.href = css_path;
        document.head.appendChild(css);

        const js = document.createElement("script");
        js.type = "module";
        js.src = js_path;
        document.head.appendChild(js);
    </script>
</head>
